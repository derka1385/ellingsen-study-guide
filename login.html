<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ellingsen — compte</title><style>[hidden]{display:none!important}:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

/* Layout: sticky chapter rail beside a ~70ch reading column. Signature: payoff matrices where Rowena (row, 1st number) is blue,
   Colin (column, 2nd number) is orange, best responses are underlined and Nash equilibria sit under a highlighter. */
:root{
  --paper:#F2F3EE; --sheet:#FBFBF7; --ink:#1A1E22; --ink-2:#4D5560; --rule:#D5D8CF;
  --row:#1D58B0; --col:#B4500E; --eq:#E2BC2E; --eq-bg:rgba(233,197,58,.30);
  --good:#2E7A4C; --bad:#B03636;
  --display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111417; --sheet:#181C20; --ink:#E5E7E1; --ink-2:#A5ADB6; --rule:#2C3238;
    --row:#86ADF2; --col:#EE9C62; --eq:#D8B53C; --eq-bg:rgba(216,181,60,.17);
    --good:#6BC08E; --bad:#E88080; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111417; --sheet:#181C20; --ink:#E5E7E1; --ink-2:#A5ADB6; --rule:#2C3238;
  --row:#86ADF2; --col:#EE9C62; --eq:#D8B53C; --eq-bg:rgba(216,181,60,.17);
  --good:#6BC08E; --bad:#E88080; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.62 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration-color:var(--ink-2);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--row);outline-offset:2px;border-radius:2px}
button,input,select{font:inherit;color:inherit}
sub,sup{font-size:.72em;line-height:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;padding:24px 14px 48px 20px;border-right:1px solid var(--rule)}
.brand{display:block;text-decoration:none;font:800 16px/1.15 var(--display);letter-spacing:-.01em}
.brand small{display:block;margin-top:6px;font:500 12px/1.4 var(--display);letter-spacing:.02em;color:var(--ink-2)}
.rail h2{font:600 11px/1 var(--display);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);margin:24px 0 8px 8px}
.rail ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.rail nav a{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:4px;text-decoration:none;font:500 14px/1.3 var(--display);color:var(--ink-2)}
.rail nav a .n{font:500 12px/1 var(--mono);min-width:1.5em}
.rail nav a:hover{background:var(--sheet);color:var(--ink)}
.rail nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.rail nav a .ok{margin-left:auto;font:600 12px var(--display);color:var(--good)}
.rail nav a[aria-current="page"] .ok{color:var(--paper)}
.short{display:none}
main{min-width:0;padding-block:44px 104px;padding-inline:clamp(16px,5vw,64px)}
.view{max-width:46rem;margin:0 auto}
.view.wide{max-width:68rem}
.read{max-width:46rem}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .rail{z-index:20;height:auto;overflow:visible;background:var(--paper);border-right:0;border-bottom:1px solid var(--rule);padding:10px 0 10px 16px}
  .brand,.rail h2{display:none}
  .rail nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-right:16px}
  .rail nav::-webkit-scrollbar{display:none}
  .rail ul{display:flex;gap:4px}
  .rail nav a{white-space:nowrap;padding:7px 11px;font-size:13px;border:1px solid var(--rule)}
  .rail nav a .n{min-width:0}
  .full{display:none}.short{display:inline}
  main{padding-block:26px 88px}
}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.kicker,.lab{font:600 11.5px/1.2 var(--display);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.view>h2,.view .h2{font-size:25px;font-weight:700;letter-spacing:-.012em;margin:52px 0 14px;padding-top:16px;border-top:1px solid var(--rule)}
.view h3{font-size:18.5px;font-weight:700;margin:30px 0 8px}
.view h4{font-size:15.5px;font-weight:700;margin:20px 0 6px}
.view p{margin:0 0 14px}
.view ul,.view ol{padding-left:1.3em;margin:0 0 14px}
.view li{margin:5px 0}
.view li::marker{color:var(--ink-2)}
.en{font-style:italic}
.tag{font:500 12.5px/1 var(--mono);color:var(--ink-2);font-weight:500;letter-spacing:0;margin-left:8px;white-space:nowrap}
.pg{font:500 12px/1 var(--mono);color:var(--ink-2);white-space:nowrap}
.who{font:600 .92em var(--display)}
.who.r{color:var(--row)}.who.c{color:var(--col)}
.muted{color:var(--ink-2)}
strong{font-weight:600}

/* ---------- chapter head ---------- */
.ch-head{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:24px;align-items:end;padding-bottom:22px;border-bottom:2px solid var(--ink);margin-bottom:26px}
.ch-num{grid-row:1/span 3;font:800 clamp(72px,11vw,112px)/.78 var(--display);letter-spacing:-.06em}
.ch-head .kicker{margin:0 0 6px}
.ch-head h1{font-size:clamp(27px,4.2vw,40px);font-weight:800;letter-spacing:-.022em}
.ch-head .fr{margin:6px 0 0;font:italic 400 18px/1.3 var(--body);color:var(--ink-2)}
.question{font:400 21px/1.45 var(--body);margin:0 0 26px}
.question::before{content:"Question centrale";display:block;font:600 11.5px/1.2 var(--display);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}

/* ---------- blocks ---------- */
.brief,.def,.box{margin:22px 0;padding:18px 22px;background:var(--sheet);border:1px solid var(--rule);border-radius:3px}
.brief ul{margin:0;padding-left:1.1em}
.brief li{margin:6px 0}
.def .lab,.box .lab{display:flex;justify-content:space-between;gap:12px}
.def blockquote{margin:0 0 10px;font:italic 400 18.5px/1.5 var(--body)}
.def>*:last-child,.box>*:last-child{margin-bottom:0}
.box.trap .lab{color:var(--bad)}
.eq{font:500 16px/1.5 var(--mono);background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:12px 16px;margin:16px 0;overflow-x:auto;white-space:nowrap;display:flex;justify-content:space-between;gap:24px}
.eq .no{color:var(--ink-2)}
.eq.left{justify-content:flex-start}
.quote{margin:18px 0;padding:0 0 0 18px;border-left:2px solid var(--ink-2);font:italic 400 17px/1.55 var(--body);color:var(--ink)}
.quote cite{display:block;margin-top:6px;font:500 12.5px var(--mono);font-style:normal;color:var(--ink-2)}
.apps{display:grid;gap:12px;margin:14px 0}
.apps>div{padding:14px 18px;border:1px solid var(--rule);border-radius:3px}
.apps>div h4{margin:0 0 4px}
.apps>div p:last-child{margin:0}
.traps{list-style:none;padding:0!important;margin:12px 0}
.traps li{padding:8px 0 8px 28px;position:relative;border-bottom:1px solid var(--rule);margin:0}
.traps li::before{content:"✕";position:absolute;left:4px;top:8px;color:var(--bad);font:600 14px var(--display)}
details.exo{border-top:1px solid var(--rule)}
details.exo:last-of-type{border-bottom:1px solid var(--rule)}
details.exo summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline;padding:13px 0;font:600 15.5px/1.4 var(--display)}
details.exo summary::-webkit-details-marker{display:none}
details.exo summary::before{content:"+";font:500 15px var(--mono);color:var(--ink-2);width:1em;flex:none}
details.exo[open] summary::before{content:"−"}
details.exo .body{padding:0 0 16px 26px}
.tablewrap{overflow-x:auto;margin:16px 0}
table.t{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
table.t th{font:600 12px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--ink)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
table.t td.m{font-family:var(--mono);font-size:14px;white-space:nowrap}
.ch-foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:56px;padding-top:18px;border-top:2px solid var(--ink)}
.ch-foot nav{display:flex;gap:18px;font:500 14px var(--display)}
.btn{appearance:none;border:1px solid var(--ink);background:transparent;padding:8px 14px;border-radius:4px;font:600 14px/1.2 var(--display);cursor:pointer}
.btn:hover{background:var(--sheet)}
.btn.on{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--rule)}
.chvocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:14px 0}
.chvocab div{background:var(--paper);padding:10px 12px;font-size:14.5px;line-height:1.4}
.chvocab b{display:block;font:600 14.5px/1.3 var(--display)}
.chvocab i{display:block;color:var(--ink-2)}
.chvocab span{display:block;margin-top:4px}

/* ---------- matrices & trees ---------- */
figure{margin:20px 0}
.mx{overflow-x:auto}
.mx table{border-collapse:collapse;font:500 16px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin:0}
.mx th{font:600 15px/1.2 var(--display);padding:5px 12px}
.mx th.r{color:var(--row);text-align:right}.mx th.c{color:var(--col)}
.mx th.corner{font:500 11px/1.25 var(--display);text-align:left;color:var(--ink-2);padding:0 8px 4px 0}
.mx td{border:1.5px solid var(--ink);background:var(--sheet);padding:9px 14px;text-align:center;white-space:nowrap}
.pr{color:var(--row)}.pc{color:var(--col)}
.br{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.mx td.ne{background:var(--eq-bg);box-shadow:inset 0 0 0 2.5px var(--eq)}
figcaption{margin-top:8px;font:500 13px/1.4 var(--display);color:var(--ink-2)}
figcaption .pg{margin-left:6px}
.stages{display:flex;flex-wrap:wrap;gap:12px 40px;align-items:flex-start;margin:20px 0}
.stages figure{margin:0}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:8px 28px;align-items:start}
.tree svg{width:100%;max-width:440px;height:auto;display:block}
.tree .e{stroke:var(--ink-2);stroke-width:1.4;fill:none}
.tree .e.on{stroke:var(--ink);stroke-width:3.2}
.tree .e.off{stroke-dasharray:5 5;opacity:.5}
.tree text{font-family:var(--display);font-size:14px;fill:var(--ink)}
.tree .lbl{font-size:13px;fill:var(--ink-2)}
.tree .pl{font-weight:600}
.tree .pr{fill:var(--row)}.tree .pc{fill:var(--col)}
.tree .pay{font-family:var(--mono);font-size:13px}
.tree .node{fill:var(--ink)}
.tree .root{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font:500 14px var(--display);margin:12px 0}
.legend span{display:inline-flex;gap:8px;align-items:center}
.sw{width:14px;height:14px;display:inline-block;border-radius:2px}

/* ---------- carte ---------- */
.hero{padding-bottom:26px;border-bottom:2px solid var(--ink)}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:-.035em;line-height:.98;max-width:14ch}
.hero .sub{margin:16px 0 0;font:400 18px/1.5 var(--body);color:var(--ink-2);max-width:44rem}
.bigq{margin:34px 0 8px;max-width:48rem}
.bigq .q-en{font:600 clamp(24px,3.6vw,34px)/1.2 var(--display);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
.bigq .q-fr{font-size:18px;color:var(--ink-2);margin:0}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(14.5rem,1fr));gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:30px 0}
.three article{padding:18px 22px 20px 0}
.three article+article{padding-left:22px;border-left:1px solid var(--rule)}
.three h3{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
.three .q{font:italic 400 16.5px/1.45 var(--body);margin:0 0 10px}
.three p{font-size:15.5px;margin:0 0 8px}
.three .chs{font:500 12.5px var(--mono);color:var(--ink-2);margin:0}
@media (max-width:760px){.three article+article{padding-left:0;border-left:0;border-top:1px solid var(--rule)}}
.road{list-style:none;padding:0!important;margin:16px 0;border-top:1px solid var(--ink)}
.road li{margin:0;border-bottom:1px solid var(--rule)}
.road a{display:grid;grid-template-columns:3.2rem minmax(0,16rem) minmax(0,1fr);gap:4px 20px;padding:13px 4px;text-decoration:none;align-items:baseline}
.road a:hover{background:var(--sheet)}
.road .n{font:800 26px/1 var(--display);letter-spacing:-.04em}
.road .t{font:700 16px/1.3 var(--display)}
.road .t i{display:block;font:italic 400 14.5px/1.35 var(--body);color:var(--ink-2)}
.road .k{font-size:15.5px;line-height:1.5}
@media (max-width:760px){.road a{grid-template-columns:2.6rem minmax(0,1fr)}.road .k{grid-column:2}}
.map svg{width:100%;max-width:660px;height:auto;display:block}
.map text{font-family:var(--display);fill:var(--ink)}
.map .en{font-size:15px;font-weight:600;font-style:normal}
.map .fr{font-family:var(--body);font-style:italic;font-size:12.5px;fill:var(--ink-2)}
.map .lv{font:600 13px var(--mono);fill:var(--ink-2)}
.map .side{font-size:12px;fill:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.map .s{stroke:var(--ink);stroke-width:1.4;fill:none}
.map .d{stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:2 4;fill:none}
.ess{columns:2 22rem;column-gap:36px;padding-left:1.2em!important}
.ess li{break-inside:avoid;margin:0 0 10px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(12.5rem,1fr));gap:10px;margin:16px 0}
.tools a{display:block;padding:14px 16px;border:1px solid var(--rule);border-radius:3px;text-decoration:none}
.tools a:hover{border-color:var(--ink)}
.tools b{display:block;font:700 15.5px/1.3 var(--display);margin-bottom:4px}
.tools span{font-size:14.5px;color:var(--ink-2);line-height:1.45;display:block}

/* ---------- tools: lexique, flashcards, quiz, labo, timeline ---------- */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.bar input[type=search],.bar select{padding:9px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);font:500 15px var(--display);min-width:0}
.bar input[type=search]{flex:1 1 16rem;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 12px;font:500 13.5px var(--display);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.count{font:500 13px var(--mono);color:var(--ink-2)}
#lex-table td:first-child{font:600 15px/1.35 var(--display);min-width:11rem}
#lex-table td:nth-child(2){font-style:italic;min-width:9rem}
#lex-table td:last-child{font:500 12.5px var(--mono);color:var(--ink-2);white-space:nowrap}
.fc-wrap{max-width:44rem}
.fc-stage{perspective:1400px;margin:14px 0}
.fc{position:relative;height:clamp(300px,52vh,440px);cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.2,1);border:0;background:none;width:100%;padding:0;text-align:left}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:28px 30px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.fc .back{transform:rotateY(180deg)}
.fc .front .term{font:700 clamp(22px,3.4vw,30px)/1.2 var(--display);letter-spacing:-.015em;text-wrap:balance}
.fc .front .hint,.fc .face .meta{font:500 12.5px var(--mono);color:var(--ink-2);margin-top:14px}
.fc .back .fr{font:italic 400 15px var(--body);color:var(--ink-2);margin-bottom:8px}
.fc .back .ans{font-size:17px;line-height:1.55}
.fc-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fc-ctl .rate-no{border-color:var(--bad);color:var(--bad)}
.fc-ctl .rate-yes{border-color:var(--good);color:var(--good)}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}
.qz{max-width:44rem}
.qz .q{font:600 20px/1.4 var(--display);margin:8px 0 16px;text-wrap:pretty}
.qz .opts{display:grid;gap:8px}
.qz .opt{appearance:none;text-align:left;padding:12px 16px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);font:400 16px/1.45 var(--body);cursor:pointer}
.qz .opt:hover:not(:disabled){border-color:var(--ink)}
.qz .opt:disabled{cursor:default}
.qz .opt.ok{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.qz .opt.ko{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.qz .expl{margin:14px 0 0;padding:14px 18px;border:1px solid var(--rule);border-radius:3px;font-size:16px}
.qz .expl b.ok{color:var(--good)}.qz .expl b.ko{color:var(--bad)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
.lab-grid{display:grid;grid-template-columns:auto repeat(2,minmax(0,9.5rem));gap:6px;align-items:center;margin:14px 0}
.lab-grid .h{font:600 15px var(--display);text-align:center}
.lab-grid .h.r{color:var(--row);text-align:right;padding-right:6px}.lab-grid .h.c{color:var(--col)}
.lab-cell{display:flex;gap:4px;padding:6px;border:1.5px solid var(--ink);background:var(--sheet)}
.lab-cell input{width:100%;min-width:0;padding:6px 4px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);font:500 16px var(--mono);text-align:center}
.lab-cell input.pr{color:var(--row)}.lab-cell input.pc{color:var(--col)}
.lab-param{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0;font:500 15px var(--display)}
.lab-param input[type=range]{flex:1 1 14rem;accent-color:var(--ink)}
.lab-param output{font:600 16px var(--mono);min-width:4ch}
.lab-out{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 32px;align-items:start;margin-top:12px}
@media (max-width:700px){.lab-out{grid-template-columns:1fr}}
.lab-out dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:15.5px}
.lab-out dt{font:600 12px/1.6 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.lab-out dd{margin:0}
.diag{margin:12px 0 0;padding:12px 16px;border:1px solid var(--ink);border-radius:3px;font-size:16px}
.tl{list-style:none;padding:0!important;margin:18px 0;border-top:1px solid var(--ink)}
.tl li{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:4px 18px;padding:12px 0;border-bottom:1px solid var(--rule);margin:0}
.tl .y{font:600 15px/1.35 var(--mono)}
.tl .w{font:700 15.5px/1.35 var(--display)}
.tl .w em{font:500 12px var(--mono);font-style:normal;color:var(--ink-2);margin-left:8px;letter-spacing:.04em;text-transform:uppercase}
.tl p{margin:3px 0 0;font-size:15.5px;line-height:1.5}
.tl a{font:500 12.5px var(--mono);color:var(--ink-2)}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:14px;margin:16px 0}
.cat article{border:1px solid var(--rule);border-radius:3px;padding:16px 18px;background:var(--paper)}
.cat h3{margin:0 0 2px!important;font-size:17px!important}
.cat .src{font:500 12px var(--mono);color:var(--ink-2);margin:0 0 6px}
.cat figure{margin:10px 0}
.cat p{font-size:15px;margin:6px 0 0}
.cat p b{font-family:var(--display);font-weight:600}
/* source tags: filled = Ellingsen's own material, outlined = general game theory, dashed = my inference */
:root{--warn:#8A5A00}

/* Account access uses the sheet's existing typography and reading palette. */

.access-gate{min-height:100svh;padding:clamp(24px,6vw,64px) 20px;background:var(--paper)}

#preferences-error{color:var(--bad);margin:0}#gate-status{overflow-wrap:anywhere;color:var(--ink-2)}
@media print{body:has(.app[hidden]) .app{display:none!important}}
</style></head><body><section id="access-gate" class="access-gate" aria-labelledby="access-title">

        <label for="auth-password" data-ui="Mot de passe">Mot de passe</label>

        <p id="auth-error" role="alert"></p>

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];

try {const saved=JSON.parse(localStorage.getItem('ioe-lang'));if (['fr','en','uk'].includes(saved)) lang=saved;} catch {}
const tr = source => lang==='fr' ? source : messages[source]?.[lang] ?? source;
function note(id,source){$(id).dataset.ui=source;$(id).textContent=tr(source);}
function render(){
 document.documentElement.lang=lang;
 $$('[data-ui]').forEach(el=>el.textContent=tr(el.dataset.ui));
 $$('#access-language button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
 $('#auth-submit').dataset.action=signup?'signup':'signin';
 note('#auth-submit',signup?'Créer un compte':'Se connecter');
 $('#auth-password').autocomplete=signup?'new-password':'current-password';
 $('#auth-signup-tab').classList.toggle('on',signup);$('#auth-signin-tab').classList.toggle('on',!signup);

 $('#gate-retry').disabled=busy;

 'auth/invalid-credential':'Adresse email ou mot de passe incorrect.',
 'auth/email-already-in-use':'Cette adresse possède déjà un compte. Choisis Se connecter.',
 'auth/invalid-email':'Vérifie le format de l’adresse email.',
 'auth/weak-password':'Utilise un mot de passe d’au moins six caractères.',
 'auth/too-many-requests':'Trop de tentatives. Attends un moment avant de réessayer.',
 'auth/popup-closed-by-user':'La fenêtre Google a été fermée. Tu peux réessayer.',
 'auth/popup-blocked':'Autorise la fenêtre Google dans ton navigateur, puis réessaie.',
 'auth/unauthorized-domain':'Ce domaine doit être ajouté aux domaines autorisés de Firebase Authentication.',
 'auth/network-request-failed':'Connexion réseau indisponible. Vérifie la connexion et réessaie.'
})[error?.code] || 'Connexion impossible. Vérifie la configuration Firebase et réessaie.';}
async function enter(user){
 busy=true;render();
 try {
  const token=await user.getIdToken();
  const response=await fetch('/session',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
